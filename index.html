<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MemoFarmaci</title>
    <meta name="theme-color" content="#5A5A40">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" sizes="192x192">
  </head>
  <body>
    <!-- OAuth callback: quando Chrome carica questa SPA su /auth/callback?code=xxx
         dopo il login Google/Facebook, facciamo subito il redirect all'app Android
         tramite intent URL. Eseguito prima del bundle JS, immune alla cache SW. -->
    <script>
      (function() {
        var code = new URLSearchParams(location.search).get('code');
        if (location.pathname === '/auth/callback' && code) {
          location.replace(
            'intent://login?code=' + encodeURIComponent(code) +
            '#Intent;scheme=it.memofarmaci.app;package=it.memofarmaci.app;end'
          );
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
